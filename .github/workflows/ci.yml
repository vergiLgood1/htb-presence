name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...
      - run: go test ./...

      - name: Cross-compile for Windows
        run: GOOS=windows CGO_ENABLED=0 go build ./...
